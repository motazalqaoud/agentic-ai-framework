[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-framework"
version = "0.1.0"
description = "A small, dependency-light framework for building tool-using LLM agents (ReAct loop, planner, memory, tool registry)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Motaz Alqaoud" }]

keywords = ["llm", "agents", "react", "tool-use", "agent-framework"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/motazalqaoud/agentic-ai-framework"
Issues = "https://github.com/motazalqaoud/agentic-ai-framework/issues"

[project.scripts]
agentic = "agentic.__main__:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
include = ["agentic*"]
